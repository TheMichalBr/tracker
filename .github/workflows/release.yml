name: "Tracker - Multiplatform Release"
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
          - platform: 'macos-latest'
          - platform: 'ubuntu-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Download code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installing Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS compilation targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Generate changelog from commits
        id: changelog
        shell: python
        run: |
          import subprocess
          import os

          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0", "HEAD^"],
                  stderr=subprocess.DEVNULL
              ).decode("utf-8").strip()
              rev_range = f"{prev_tag}..HEAD"
          except Exception:
              rev_range = "HEAD"

          log_args = ["git", "log", "--no-merges", "--format=format:__COMMIT__%s (`%h`)%n%b"]
          if ".." in rev_range:
              log_args.append(rev_range)
          else:
              log_args.extend(["-n", "15"])

          try:
              raw_log = subprocess.check_output(log_args).decode("utf-8", errors="replace")
          except Exception:
              raw_log = ""

          formatted = []
          for line in raw_log.splitlines():
              if line.startswith("__COMMIT__"):
                  title = line.replace("__COMMIT__", "").strip()
                  formatted.append(f"\n- **{title}**")
              elif line.strip():
                  stripped = line.strip()
                  if not stripped.startswith(("-", "*")):
                      formatted.append(f"  - {stripped}")
                  else:
                      formatted.append(f"  {stripped}")

          changelog = "\n".join(formatted).strip()
          if not changelog:
              changelog = "- Maintenance and performance improvements"

          output_file = os.environ.get("GITHUB_OUTPUT")
          if output_file:
              with open(output_file, "a", encoding="utf-8") as f:
                  f.write(f"commits<<EOF\n{changelog}\nEOF\n")

      - name: Compiling and creating installer
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Tracker v__VERSION__'
          releaseBody: |
            Multiplatform release of Tracker for **Windows**, **macOS**, and **Linux**.

            - **Windows:**
              - `Tracker_..._x64-setup.exe` / `.msi` – Windows installer.
              - `Tracker_..._x64_Portable.exe` – Portable standalone version (no installation needed; stores locally in the `data/` folder).

            - **macOS:**
              - `Tracker_..._universal.dmg` – Universal installer disk image for both **Apple Silicon** and **Intel** Macs.

            - **Linux:**
              - `tracker_..._amd64.deb` – Package installer for **Debian, Ubuntu, Linux Mint**, and derivatives.
              - `tracker_..._amd64.AppImage` – Universal standalone portable package for **all Linux distributions** (grant execution permission with `chmod +x`).

            ---

            #### What's changed:
            ${{ steps.changelog.outputs.commits }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      - name: Upload Windows portable executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tauri_build.outputs.releaseTagName }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag -or $tag -eq "main") {
            $conf = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
            $tag = "v" + $conf.version
          }
          $cleanVer = $tag.TrimStart("v")
          $portableName = "Tracker_${cleanVer}_x64_Portable.exe"
          $targetPath = "src-tauri/target/release/$portableName"
          Copy-Item "src-tauri/target/release/tracker.exe" -Destination $targetPath
          gh release upload $tag $targetPath --clobber