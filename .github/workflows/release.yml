name: "Release - TEST"
on:
  workflow_dispatch: # Umožní spustit build kdykoliv ručně jedním kliknutím v GitHubu
  push:
    tags:
      - 'v*' # Nebo se automaticky spustí, když pushneš tag (např. v1.0.0)
jobs:
  build-tauri:
    permissions:
      contents: write # Povolení pro GitHub Actions vytvořit Release a nahrát soubory
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest' # Virtuální Windows stroj na GitHubu
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Stáhnutí kódu (Checkout)
        uses: actions/checkout@v4
      - name: Instalace Rustu
        uses: dtolnay/rust-toolchain@stable
      - name: Sestavení a vytvoření instalátoru
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Vestavěný token GitHubu (nemusíš nic generovat)
        with:
          tagName: v__VERSION__ # Převezme verzi automaticky z tauri.conf.json
          releaseName: 'Tracker v__VERSION__'
          releaseBody: 'Automaticky vytvořený release aplikace Tracker.'
          releaseDraft: false
          prerelease: false