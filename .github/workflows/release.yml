name: "Tracker - Windows 11/10 Release"
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Download code
        uses: actions/checkout@v4
      - name: Installing rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compiling and creating an installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Tracker v__VERSION__'
          releaseBody: 'Automatically generated release of the Tracker app for Windows 11/10.'
          releaseDraft: false
          prerelease: false