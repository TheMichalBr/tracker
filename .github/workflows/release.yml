name: "Tracker - Windows 11/10 Release"
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Stáhnutí kódu (Checkout)
        uses: actions/checkout@v4
      - name: Instalace Rustu
        uses: dtolnay/rust-toolchain@stable
      - name: Sestavení a vytvoření instalátoru
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Tracker v__VERSION__'
          releaseBody: 'Automaticky vytvořený release aplikace Tracker.'
          releaseDraft: false
          prerelease: false