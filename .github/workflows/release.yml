name: "Tracker - Windows 11/10 Release"
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
    runs-on: ${{ matrix.platform }}
    steps:

      - name: Download code
        uses: actions/checkout@v4
      - name: Installing rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compiling and creating an installer
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Tracker v__VERSION__'
          releaseBody: 'Automatically generated release of the Tracker app for Windows 11/10.'
          releaseDraft: false
          prerelease: false

      - name: Upload portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.tauri_build.outputs.releaseTagName }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if (-not $tag -or $tag -eq "main") {
            $conf = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
            $tag = "v" + $conf.version
          }
          $cleanVer = $tag.TrimStart("v")
          $portableName = "Tracker_${cleanVer}_x64_Portable.exe"
          $targetPath = "src-tauri/target/release/$portableName"
          Copy-Item "src-tauri/target/release/tracker.exe" -Destination $targetPath
          gh release upload $tag $targetPath --clobber